<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold It ⚡</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08080f;
  --surface: #0f0f1c;
  --surface2: #161628;
  --border: #1e1e32;
  --text: #e2e2f0;
  --muted: #5a5a88;
  --purple: #7c3aed;
  --purple-l: #a78bfa;
  --teal: #06d6a0;
  --red: #ef4444;
  --gold: #fbbf24;
  --paper: #f5f0e8;
  --paper2: #ede8d8;
  --r: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.75rem 1rem 5rem;
  overflow-x: hidden;
}

/* ── Ambient bg ───────────────────── */
body::before, body::after {
  content: '';
  position: fixed; border-radius: 50%;
  filter: blur(120px); pointer-events: none; z-index: 0;
}
body::before { width: 500px; height: 500px; top: -200px; left: -150px;
  background: rgba(124,58,237,0.12); }
body::after  { width: 400px; height: 400px; bottom: -150px; right: -100px;
  background: rgba(6,214,160,0.1); }

.wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column; gap: 1rem;
}

/* ── Header ───────────────────────── */
.hdr { text-align: center; padding-bottom: 0.25rem; }
.hdr h1 {
  font-size: 1.6rem; font-weight: 900; letter-spacing: 0.08em;
  background: linear-gradient(135deg, var(--purple-l), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hdr p { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; letter-spacing: 0.07em; }

/* ── REVEAL FRAME ─────────────────── */
.reveal-outer {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 0 0 1px rgba(124,58,237,0.15), 0 20px 60px rgba(0,0,0,0.6);
  background: #000;
  aspect-ratio: 3/4;
  max-height: 420px;
}

/* BG image */
.reveal-bg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 0.75rem;
  transition: opacity 0.5s;
  background: linear-gradient(135deg, #1a0533 0%, #0a1a2e 40%, #001a14 100%);
  overflow: hidden;
}
.reveal-bg::before {
  content: '';
  position: absolute; inset: 0;
  background: url('') center/cover no-repeat;
  filter: brightness(0.9);
  transition: opacity 0.5s;
  opacity: 0;
}
.reveal-bg.has-image::before { opacity: 1; }
.reveal-bg-stars { position: absolute; inset: 0; overflow: hidden; }

.reward-msg {
  position: relative; z-index: 1;
  text-align: center; padding: 1.5rem;
}
.reward-msg .emo { font-size: 4rem; display: block; margin-bottom: 0.75rem;
  filter: drop-shadow(0 0 20px rgba(251,191,36,0.8));
  animation: glow-pulse 1.5s ease-in-out infinite; }
@keyframes glow-pulse {
  0%,100% { filter: drop-shadow(0 0 20px rgba(251,191,36,0.6)); }
  50% { filter: drop-shadow(0 0 35px rgba(251,191,36,1)); }
}
.reward-msg h2 { font-size: 1.3rem; font-weight: 800; color: var(--gold);
  text-shadow: 0 0 20px rgba(251,191,36,0.6); }
.reward-msg p { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 0.4rem; }

/* set-image button inside bg */
.set-img-btn {
  position: absolute; bottom: 12px; right: 12px; z-index: 5;
  background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7); font-size: 0.68rem; padding: 0.3rem 0.7rem;
  border-radius: 8px; cursor: pointer; backdrop-filter: blur(8px);
  transition: all 0.2s; letter-spacing: 0.05em;
}
.set-img-btn:hover { background: rgba(124,58,237,0.5); color: #fff; border-color: rgba(124,58,237,0.5); }

/* ── PAPER STRIPS ─────────────────── */
.strips-wrap {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  pointer-events: none;
}

.strip {
  flex: 1;
  position: relative;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  transform-origin: top center;
  transition: none;
  pointer-events: auto;
  overflow: visible;
}

/* Paper texture */
.strip::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 4px,
      rgba(0,0,0,0.015) 4px, rgba(0,0,0,0.015) 5px
    ),
    repeating-linear-gradient(0deg,
      transparent 0px, transparent 8px,
      rgba(0,0,0,0.01) 8px, rgba(0,0,0,0.01) 9px
    );
}

/* Torn bottom edge (except last strip) */
.strip:not(:last-child)::after {
  content: '';
  position: absolute;
  bottom: -5px; left: 0; right: 0; height: 10px;
  z-index: 3;
  background: var(--paper2);
  clip-path: polygon(
    0% 0%,   1% 100%, 2.5% 20%, 4% 85%, 5.5% 5%,
    7% 90%,  8.5% 15%, 10% 80%, 11.5% 0%,
    13% 95%, 14.5% 10%, 16% 75%, 17.5% 5%,
    19% 100%,20.5% 20%, 22% 90%, 23.5% 5%,
    25% 85%, 26.5% 0%, 28% 95%, 29.5% 15%,
    31% 80%, 32.5% 0%, 34% 90%, 35.5% 10%,
    37% 75%, 38.5% 5%, 40% 100%, 41.5% 20%,
    43% 85%, 44.5% 0%, 46% 90%, 47.5% 15%,
    49% 80%, 50.5% 5%, 52% 95%, 53.5% 20%,
    55% 85%, 56.5% 0%, 58% 90%, 59.5% 10%,
    61% 75%, 62.5% 5%, 64% 100%, 65.5% 20%,
    67% 85%, 68.5% 0%, 70% 90%, 71.5% 15%,
    73% 80%, 74.5% 5%, 76% 95%, 77.5% 20%,
    79% 85%, 80.5% 0%, 82% 90%, 83.5% 10%,
    85% 75%, 86.5% 5%, 88% 100%, 89.5% 20%,
    91% 85%, 92.5% 0%, 94% 90%, 95.5% 15%,
    97% 80%, 98.5% 5%, 100% 0%,
    100% 0%
  );
}

/* Strip content */
.strip-inner {
  position: relative; z-index: 2;
  text-align: center; user-select: none;
}
.strip-day {
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em;
  color: rgba(60,40,100,0.5); text-transform: uppercase;
}
.strip-icon { font-size: 1.8rem; display: block; margin: 0.2rem 0; }
.strip-status { font-size: 0.62rem; color: rgba(60,40,100,0.4); }

/* Strip that's currently active (next to tear) - subtle glow on bottom */
.strip.next-up {
  background: linear-gradient(180deg, var(--paper) 70%, var(--paper2) 100%);
  border-bottom: 1px dashed rgba(124,58,237,0.25);
}

/* ── TEAR ANIMATION ───────────────── */
@keyframes tear-off {
  0%   { transform: translateY(0) rotate(0deg) scaleX(1);   opacity: 1; }
  8%   { transform: translateY(-4%) rotate(-1deg) scaleX(1.01); opacity: 1; }
  100% { transform: translateY(140%) rotate(6deg) scaleX(0.95); opacity: 0; }
}
.strip.tearing {
  animation: tear-off 0.65s cubic-bezier(0.55, 0, 0.9, 0.5) forwards;
  pointer-events: none;
  z-index: 10;
}

/* ── Progress dots ────────────────── */
.dots-row {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface2);
  transition: all 0.4s;
}
.dot.done {
  background: var(--teal);
  border-color: var(--teal);
  box-shadow: 0 0 8px rgba(6,214,160,0.6);
}
.dot.active {
  border-color: var(--purple-l);
  background: rgba(124,58,237,0.2);
  animation: dot-pulse 1.5s ease-in-out infinite;
}
@keyframes dot-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,0); }
  50% { box-shadow: 0 0 0 4px rgba(124,58,237,0.2); }
}
.dots-label {
  font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em;
  margin-left: 0.5rem;
}

/* ── Timer bar ────────────────────── */
.timer-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 1.25rem;
  text-align: center;
}
.timer-label {
  font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em;
  text-transform: uppercase; margin-bottom: 0.35rem;
}
.timer-val {
  font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums;
  line-height: 1;
}
.timer-val.active {
  background: linear-gradient(135deg, var(--purple-l), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.timer-val.done { color: var(--gold); }
.timer-val.virgin { color: var(--muted); }
.timer-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
.progress-bar-bg {
  height: 5px; background: var(--surface2); border-radius: 999px;
  overflow: hidden; margin-top: 0.85rem;
}
.progress-bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--purple), var(--teal));
  transition: width 1s linear;
}

/* ── Buttons ──────────────────────── */
.btn-row { display: flex; flex-direction: column; gap: 0.65rem; }

.btn {
  width: 100%; padding: 1rem 1.25rem;
  border: none; border-radius: var(--r);
  font-size: 0.95rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.04em;
  transition: all 0.22s;
  position: relative; overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.07) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.btn:hover::after { transform: translateX(100%); }

.btn-break {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--red);
}
.btn-break:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.4); }

.btn-start {
  background: linear-gradient(135deg, var(--purple), #5b21b6);
  color: #fff;
  box-shadow: 0 4px 20px rgba(124,58,237,0.4);
}
.btn-start:hover { box-shadow: 0 6px 28px rgba(124,58,237,0.6); transform: translateY(-1px); }

.btn-redeem {
  background: linear-gradient(135deg, var(--gold), #f59e0b);
  color: #1a1000; font-weight: 800;
  box-shadow: 0 4px 22px rgba(251,191,36,0.45);
  animation: redeem-pulse 1.8s ease-in-out infinite;
  display: none;
}
@keyframes redeem-pulse {
  0%,100% { box-shadow: 0 4px 22px rgba(251,191,36,0.4); transform: translateY(0); }
  50% { box-shadow: 0 6px 32px rgba(251,191,36,0.7); transform: translateY(-2px); }
}

/* ── Stats ────────────────────────── */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem;
}
.stat-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 0.8rem 0.5rem; text-align: center;
}
.stat-n { font-size: 1.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.25rem; }
.stat-n.s { color: var(--gold); }
.stat-n.t { color: var(--teal); }
.stat-n.d { color: var(--purple-l); }
.stat-lbl { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; }

/* ── Tip ──────────────────────────── */
.tip-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--purple);
  border-radius: var(--r); padding: 0.9rem 1.1rem;
}
.tip-lbl { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.45rem; }
.tip-txt { font-size: 0.86rem; color: var(--text); line-height: 1.6; font-style: italic; transition: opacity 0.3s; }
.tip-btn { background:none; border:none; color:var(--muted); font-size:0.7rem; cursor:pointer; margin-top:0.45rem; transition:color 0.2s; padding:0; }
.tip-btn:hover { color: var(--purple-l); }

/* ── Achievements ─────────────────── */
.ach-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.1rem; }
.sec-lbl { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.13em; text-transform: uppercase; margin-bottom: 0.75rem; }
.badges { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.badge { display:flex; align-items:center; gap:0.35rem; padding:0.35rem 0.75rem; border-radius:999px; font-size:0.73rem; font-weight:600; transition:all 0.3s; }
.badge.on { background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.3); color:var(--gold); }
.badge.off { background:var(--surface2); border:1px solid var(--border); color:var(--muted); opacity:0.5; filter:grayscale(1); }
.badge.pop { animation: bpop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes bpop { from { transform:scale(0.3); opacity:0; } to { transform:scale(1); opacity:1; } }

/* ── History ──────────────────────── */
.hist-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:1rem 1.1rem; }
.hist-list { display:flex; flex-direction:column; gap:0.4rem; max-height:180px; overflow-y:auto; }
.hist-item { display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0.65rem; background:var(--surface2); border-radius:9px; font-size:0.76rem; }
.hist-item.ok  { border-left:3px solid var(--teal); }
.hist-item.bad { border-left:3px solid var(--red); }
.hist-sub { font-size:0.68rem; color:var(--muted); margin-top:0.1rem; }
.hist-res { font-weight:700; }
.hist-item.ok  .hist-res { color:var(--teal); }
.hist-item.bad .hist-res { color:var(--red); }
.empty-msg { color:var(--muted); font-size:0.78rem; text-align:center; padding:1rem 0; }

/* ── Reset ────────────────────────── */
.reset-btn { background:none; border:1px solid var(--border); color:var(--muted); font-size:0.65rem; padding:0.35rem 0.75rem; border-radius:8px; cursor:pointer; transition:all 0.2s; }
.reset-btn:hover { border-color:var(--red); color:var(--red); }

/* ── Modal ────────────────────────── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); backdrop-filter:blur(12px); z-index:100; display:flex; align-items:center; justify-content:center; padding:1rem; opacity:0; pointer-events:none; transition:opacity 0.25s; }
.overlay.on { opacity:1; pointer-events:all; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:2rem; max-width:320px; width:100%; text-align:center; transform:scale(0.9) translateY(10px); transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.overlay.on .modal { transform:scale(1) translateY(0); }
.m-icon { font-size:3rem; display:block; margin-bottom:0.9rem; }
.m-title { font-size:1.1rem; font-weight:800; margin-bottom:0.5rem; }
.m-held { font-size:1.5rem; font-weight:800; color:var(--purple-l); margin:0.6rem 0; }
.m-body { font-size:0.82rem; color:var(--muted); line-height:1.65; margin-bottom:1.4rem; }
.m-btns { display:flex; flex-direction:column; gap:0.55rem; }
.m-persist { padding:0.85rem; border-radius:12px; border:none; background:linear-gradient(135deg,var(--purple),#5b21b6); color:#fff; font-size:0.9rem; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
.m-persist:hover { opacity:0.88; }
.m-yield { padding:0.85rem; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--red); font-size:0.82rem; cursor:pointer; transition:background 0.2s; }
.m-yield:hover { background:rgba(239,68,68,0.09); }

/* ── Image modal ──────────────────── */
.img-input {
  width:100%; padding:0.75rem; border-radius:10px;
  border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-size:0.82rem; outline:none; margin-bottom:0.75rem;
  transition:border-color 0.2s;
}
.img-input:focus { border-color:var(--purple); }

/* ── Toast ────────────────────────── */
.toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:0.7rem 1.3rem; font-size:0.82rem; z-index:200; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; box-shadow:0 8px 32px rgba(0,0,0,0.5); pointer-events:none; }
.toast.up { transform:translateX(-50%) translateY(0); }
.toast.ok   { border-color:var(--teal);    color:var(--teal); }
.toast.bad  { border-color:var(--red);     color:var(--red); }
.toast.info { border-color:var(--purple);  color:var(--purple-l); }
.toast.gold { border-color:var(--gold);    color:var(--gold); }

/* ── Scrollbar ────────────────────── */
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <header class="hdr">
    <h1>⚡ Hold It</h1>
    <p>4 天撕完 · 全漏出来才能撸</p>
  </header>

  <!-- ═══ REVEAL FRAME ═══ -->
  <div class="reveal-outer">

    <!-- Background (reward image) -->
    <div class="reveal-bg" id="revealBg">
      <!-- Stars decoration -->
      <div class="reveal-bg-stars" id="bgStars"></div>
      <!-- Default reward message -->
      <div class="reward-msg" id="rewardMsg">
        <span class="emo">🎉</span>
        <h2>解锁成功！</h2>
        <p>你赢得了这次奖励</p>
      </div>
    </div>

    <!-- 4 Paper strips (0=top/last, 3=bottom/first to tear) -->
    <div class="strips-wrap" id="stripsWrap">
      <div class="strip" id="strip-0">
        <div class="strip-inner">
          <div class="strip-day">第 4 天</div>
          <span class="strip-icon">📄</span>
          <div class="strip-status">最后一关</div>
        </div>
      </div>
      <div class="strip" id="strip-1">
        <div class="strip-inner">
          <div class="strip-day">第 3 天</div>
          <span class="strip-icon">📄</span>
          <div class="strip-status">再撑一天</div>
        </div>
      </div>
      <div class="strip" id="strip-2">
        <div class="strip-inner">
          <div class="strip-day">第 2 天</div>
          <span class="strip-icon">📄</span>
          <div class="strip-status">越来越近了</div>
        </div>
      </div>
      <div class="strip" id="strip-3">
        <div class="strip-inner">
          <div class="strip-day">第 1 天</div>
          <span class="strip-icon">📄</span>
          <div class="strip-status">撑过今天</div>
        </div>
      </div>
    </div>

    <!-- Set image button -->
    <button class="set-img-btn" onclick="openImgModal()">🖼 换底图</button>
  </div>
  <!-- ═══════════════════════ -->

  <!-- Progress dots -->
  <div class="dots-row" id="dotsRow">
    <div class="dot" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
    <div class="dot" id="dot-3"></div>
    <span class="dots-label" id="dotsLabel">0 / 4 天</span>
  </div>

  <!-- Timer -->
  <div class="timer-box" id="timerBox">
    <div class="timer-label" id="timerLabel">距离下一张</div>
    <div class="timer-val virgin" id="timerVal">-- : -- : --</div>
    <div class="timer-sub" id="timerSub">开始你的第一次训练</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-start" id="btnStart" onclick="handleStart()">
      🎯 开始训练 · 第一次记录
    </button>
    <button class="btn btn-redeem" id="btnRedeem" onclick="handleRedeem()">
      🎉 已全部揭开！享用并重置
    </button>
    <button class="btn btn-break" id="btnBreak" onclick="handleBreak()" style="display:none">
      💔 记录一次（破戒）
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-n s" id="statStreak">0</div>
      <div class="stat-lbl">🔥 连续达标</div>
    </div>
    <div class="stat-box">
      <div class="stat-n t" id="statTotal">0</div>
      <div class="stat-lbl">✅ 总成功次</div>
    </div>
    <div class="stat-box">
      <div class="stat-n d" id="statDays">0</div>
      <div class="stat-lbl">📅 累计天数</div>
    </div>
  </div>

  <!-- Tip -->
  <div class="tip-box">
    <div class="tip-lbl">💡 自控提示</div>
    <div class="tip-txt" id="tipTxt">冲动一般只持续 3-5 分钟，等一等就过去了。</div>
    <button class="tip-btn" onclick="nextTip()">↻ 换一条</button>
  </div>

  <!-- Achievements -->
  <div class="ach-box">
    <div class="sec-lbl">🏆 成就解锁</div>
    <div class="badges" id="badges"></div>
  </div>

  <!-- History -->
  <div class="hist-box">
    <div class="sec-lbl">📜 记录历史</div>
    <div class="hist-list" id="histList"><div class="empty-msg">暂无记录</div></div>
  </div>

  <!-- Reset -->
  <div style="text-align:center;padding-top:.25rem">
    <button class="reset-btn" onclick="askReset()">重置所有数据</button>
  </div>

</div><!-- /wrap -->

<!-- ═══ MODAL ═══ -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="modal">
    <span class="m-icon" id="mIcon">🧊</span>
    <div class="m-title" id="mTitle"></div>
    <div class="m-held" id="mHeld"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<!-- Image modal -->
<div class="overlay" id="imgOverlay" onclick="imgOverlayBg(event)">
  <div class="modal">
    <span class="m-icon">🖼️</span>
    <div class="m-title">设置奖励底图</div>
    <div class="m-body" style="margin-bottom:1rem">输入图片网址（URL），图片将作为底图藏在白纸后面。可以是任何你喜欢的图。</div>
    <input class="img-input" id="imgInput" type="url" placeholder="https://example.com/image.jpg" />
    <div class="m-btns">
      <button class="m-persist" onclick="applyImage()">✅ 确认设置</button>
      <button class="m-yield" onclick="clearImage()">清除底图</button>
      <button class="m-yield" style="color:var(--muted)" onclick="closeImgModal()">取消</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* =============================================
   CONFIG
   ============================================= */
const INTERVAL_MS = 24 * 60 * 60 * 1000; // 24h per strip
const STRIPS      = 4;
const SK          = 'holdit_v1';

const TIPS = [
  "冲动一般只持续 3-5 分钟，等一等就过去了。",
  "你正在训练大脑的前额叶皮层——自控力中枢。",
  "延迟满足 = 更高的智识水平 + 更强的幸福感。",
  "每一次忍住，都是一次神经连接的重塑。",
  "多巴胺是骗子，它让你误以为「想要」等于「需要」。",
  "短暂的不适感，换来长期的掌控感与自由。",
  "你比冲动更强大，只需要再撑几分钟。",
  "意志力像肌肉：每次克制都在强化它。",
  "真正的自由，是能选择「不做」某件事的能力。",
  "冷静技巧：喝杯水，做 5 次深呼吸，等 10 分钟。",
  "你在训练的，是未来那个更自由的自己。",
  "每次撕掉一张，都是一次真实的胜利感。",
  "想象底图慢慢露出来的感觉——那是你努力换来的。",
];

const ACHS = [
  { id:'first',  e:'🌱', n:'破冰之举',  desc:'第一次完成4天解锁', chk: s => s.total >= 1  },
  { id:'s3',     e:'🔥', n:'三连解锁',  desc:'连续达标 3 次',    chk: s => s.streak >= 3  },
  { id:'s7',     e:'🏆', n:'意志一周',  desc:'连续达标 7 次',    chk: s => s.streak >= 7  },
  { id:'s14',    e:'💎', n:'两周传说',  desc:'连续达标 14 次',   chk: s => s.streak >= 14 },
  { id:'t10',    e:'🎖️', n:'百炼成钢',  desc:'累计成功 10 次',   chk: s => s.total >= 10  },
  { id:'day30',  e:'📅', n:'月修道者',  desc:'累计训练 30 天',   chk: s => getTotalDays() >= 30 },
];

/* =============================================
   STATE
   ============================================= */
let S = {
  startTs:  null,   // timestamp when user started (first record)
  lastTs:   null,   // timestamp of last occurrence (break or redeem)
  streak:   0,
  total:    0,
  ach:      [],     // unlocked achievement ids
  history:  [],     // [{ts, ok, elapsed}]
  tipIdx:   0,
  imageUrl: '',
};

// Non-persisted
let lastKnownRemoved = -1; // -1 = uninitialized

function load() {
  try {
    const r = localStorage.getItem(SK);
    if (r) Object.assign(S, JSON.parse(r));
  } catch(e) {}
}
function save() {
  try { localStorage.setItem(SK, JSON.stringify(S)); } catch(e) {}
}

/* =============================================
   CORE CALCULATIONS
   ============================================= */
const now = () => Date.now();

function getState() {
  if (!S.lastTs) return 'virgin';
  const removed = getStripsRemoved();
  return removed >= STRIPS ? 'done' : 'active';
}

function getStripsRemoved() {
  if (!S.lastTs) return 0;
  return Math.min(STRIPS, Math.floor((now() - S.lastTs) / INTERVAL_MS));
}

function getStripsLeft() {
  return STRIPS - getStripsRemoved();
}

function getMsToNextStrip() {
  if (!S.lastTs) return 0;
  const removed = getStripsRemoved();
  if (removed >= STRIPS) return 0;
  const nextAt = S.lastTs + (removed + 1) * INTERVAL_MS;
  return Math.max(0, nextAt - now());
}

function getStripProgress() {
  if (!S.lastTs) return 0;
  const removed = getStripsRemoved();
  if (removed >= STRIPS) return 1;
  const stripStart = S.lastTs + removed * INTERVAL_MS;
  return Math.min(1, (now() - stripStart) / INTERVAL_MS);
}

function getTotalDays() {
  if (!S.startTs) return 0;
  return Math.max(0, Math.floor((now() - S.startTs) / 86400000));
}

function fmtTime(ms) {
  const ts = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(ts / 3600);
  const m = Math.floor((ts % 3600) / 60);
  const s = ts % 60;
  return [h, m, s].map(x => String(x).padStart(2, '0')).join(':');
}
function fmtDur(ms) {
  if (ms < 60000) return `${Math.floor(ms/1000)} 秒`;
  if (ms < 3600000) return `${Math.floor(ms/60000)} 分钟`;
  if (ms < 86400000) {
    const h = Math.floor(ms/3600000);
    const m = Math.floor((ms%3600000)/60000);
    return h + '小时' + (m ? m+'分' : '');
  }
  const d = Math.floor(ms/86400000);
  const h = Math.floor((ms%86400000)/3600000);
  return d + '天' + (h ? h+'小时' : '');
}
function fmtDate(ts) {
  const d = new Date(ts), n = new Date();
  const t = [d.getHours(), d.getMinutes()].map(x=>String(x).padStart(2,'0')).join(':');
  if (d.toDateString() === n.toDateString()) return '今天 '+t;
  if (new Date(n-86400000).toDateString() === d.toDateString()) return '昨天 '+t;
  return `${d.getMonth()+1}月${d.getDate()}日 ${t}`;
}

/* =============================================
   STRIPS DOM
   ============================================= */
function getStripEl(idx) { return document.getElementById(`strip-${idx}`); }

// Strip index to remove = 3 - (nthRemoval - 1) = 4 - nthRemoval
// nthRemoval 1 → strip 3 (bottom)
// nthRemoval 2 → strip 2
// nthRemoval 3 → strip 1
// nthRemoval 4 → strip 0 (top)
function stripIdxForRemoval(n) { return STRIPS - n; }

function instantHideStrips(count) {
  for (let n = 1; n <= count; n++) {
    const el = getStripEl(stripIdxForRemoval(n));
    if (el) {
      el.style.display = 'none';
      el.classList.remove('tearing');
    }
  }
}

function animateTear(stripIdx, cb) {
  const el = getStripEl(stripIdx);
  if (!el) { if (cb) cb(); return; }
  el.classList.add('tearing');
  setTimeout(() => {
    el.style.display = 'none';
    el.classList.remove('tearing');
    if (cb) cb();
  }, 680);
}

function resetStrips() {
  for (let i = 0; i < STRIPS; i++) {
    const el = getStripEl(i);
    if (el) {
      el.style.display = '';
      el.classList.remove('tearing', 'next-up');
    }
  }
}

function syncStripsInstant() {
  const removed = getStripsRemoved();
  resetStrips();
  instantHideStrips(removed);
  // Mark the next strip
  if (removed < STRIPS) {
    const nextEl = getStripEl(stripIdxForRemoval(removed + 1));
    if (nextEl) nextEl.classList.add('next-up');
  }
  lastKnownRemoved = removed;
}

/* =============================================
   RECORD EVENT
   ============================================= */
function record(broke) {
  const ts = now();
  const el = S.lastTs ? ts - S.lastTs : 0;
  const wasSuccess = !broke;

  if (!S.startTs) S.startTs = ts;

  if (broke) {
    // Breaking during active period
    if (S.lastTs) S.history.unshift({ ts, ok: false, elapsed: el });
    S.streak = 0;
    S.lastTs = ts;
  } else {
    // Successful completion (redeem) or first start
    if (S.lastTs) {
      S.streak++;
      S.total++;
      S.history.unshift({ ts, ok: true, elapsed: el });
    }
    S.lastTs = ts;
  }

  if (S.history.length > 30) S.history.pop();
  save();

  const newA = checkAch();
  return newA;
}

/* =============================================
   ACHIEVEMENTS
   ============================================= */
function checkAch() {
  const fresh = [];
  ACHS.forEach(a => {
    if (!S.ach.includes(a.id) && a.chk(S)) {
      S.ach.push(a.id);
      fresh.push(a);
    }
  });
  if (fresh.length) save();
  return fresh;
}

/* =============================================
   BUTTON HANDLERS
   ============================================= */
function handleStart() {
  // First ever record
  record(false);
  syncStripsInstant();
  renderAll();
  toast('🎯 开始计时！坚持 4 天揭开底图！', 'info');
}

function handleBreak() {
  if (getState() === 'virgin') return;
  const elapsed = S.lastTs ? now() - S.lastTs : 0;
  const removed = getStripsRemoved();
  // Show warning modal
  document.getElementById('mIcon').textContent = '💔';
  document.getElementById('mTitle').textContent = '确认破戒？';
  document.getElementById('mHeld').textContent = `已坚持 ${fmtDur(elapsed)}`;
  document.getElementById('mBody').textContent = `已撕掉 ${removed} 张，还剩 ${STRIPS - removed} 张。\n破戒会重置所有白纸，从头开始。`;
  document.getElementById('mBtns').innerHTML = `
    <button class="m-persist" onclick="closeModal()">💪 算了，我还能忍</button>
    <button class="m-yield" onclick="confirmBreak()">确认破戒，重置</button>
  `;
  openModal();
}

function confirmBreak() {
  closeModal();
  record(true);
  resetStrips();
  syncStripsInstant();
  renderAll();
  toast('💔 破戒…白纸回来了，下次再赢', 'bad');
}

function handleRedeem() {
  document.getElementById('mIcon').textContent = '🎉';
  document.getElementById('mTitle').textContent = '你做到了！';
  document.getElementById('mHeld').textContent = `坚持了 4 天`;
  document.getElementById('mBody').textContent = '底图已完全揭开，享用这次奖励吧！\n享用后将重置，开启新一轮挑战。';
  document.getElementById('mBtns').innerHTML = `
    <button class="m-persist" onclick="confirmRedeem()">🎊 享用！开始新一轮</button>
    <button class="m-yield" onclick="closeModal()">再等等</button>
  `;
  openModal();
}

function confirmRedeem() {
  closeModal();
  const newA = record(false);
  resetStrips();
  syncStripsInstant();
  renderAll();
  if (newA.length) {
    toast(`🏆 新成就解锁：${newA[0].n}！`, 'gold');
  } else {
    toast(`✅ 完成！连续达标 ${S.streak} 次！`, 'ok');
  }
}

/* =============================================
   TICK (every second)
   ============================================= */
function tick() {
  const st = getState();
  if (st === 'virgin') return;

  const currentRemoved = getStripsRemoved();

  // Detect new strip removal
  if (currentRemoved > lastKnownRemoved && lastKnownRemoved >= 0) {
    const toTear = currentRemoved - lastKnownRemoved;
    let delay = 0;
    for (let i = 1; i <= toTear; i++) {
      const targetN = lastKnownRemoved + i;     // nth removal
      const stripIdx = stripIdxForRemoval(targetN);
      setTimeout(() => {
        animateTear(stripIdx, () => {
          // Mark next-up
          if (targetN < STRIPS) {
            const nextEl = getStripEl(stripIdxForRemoval(targetN + 1));
            if (nextEl) { nextEl.classList.remove('next-up'); nextEl.classList.add('next-up'); }
          }
        });
        toast(`🎊 第 ${targetN} 张撕掉了！还剩 ${STRIPS - targetN} 张`, targetN < STRIPS ? 'ok' : 'gold');
      }, delay);
      delay += 800;
    }
    lastKnownRemoved = currentRemoved;
    setTimeout(renderAll, delay + 100);
    return;
  }

  // Regular timer update
  renderTimer(st, currentRemoved);
  renderDots(currentRemoved);
}

/* =============================================
   RENDER
   ============================================= */
function renderAll() {
  const st = getState();
  const removed = getStripsRemoved();

  renderTimer(st, removed);
  renderDots(removed);
  renderButtons(st);
  renderStats();
  renderAch();
  renderHistory();
  renderTip();
  renderImage();
}

function renderTimer(st, removed) {
  const lbl  = document.getElementById('timerLabel');
  const val  = document.getElementById('timerVal');
  const sub  = document.getElementById('timerSub');
  const fill = document.getElementById('progressFill');

  if (st === 'virgin') {
    lbl.textContent = '等待开始';
    val.className   = 'timer-val virgin';
    val.textContent = '00:00:00';
    sub.textContent = '点击按钮开始你的训练';
    fill.style.width = '0%';
    return;
  }

  if (st === 'done') {
    lbl.textContent = '🎉 全部揭开！';
    val.className   = 'timer-val done';
    val.textContent = '解锁成功';
    sub.textContent = '点击下方按钮享用奖励';
    fill.style.width = '100%';
    return;
  }

  // active
  lbl.textContent = `距离撕掉第 ${removed + 1} 张`;
  val.className   = 'timer-val active';
  val.textContent = fmtTime(getMsToNextStrip());
  sub.textContent = `已撕 ${removed} 张 · 还剩 ${STRIPS - removed} 张`;
  fill.style.width = (getStripProgress() * 100) + '%';
}

function renderDots(removed) {
  for (let i = 0; i < STRIPS; i++) {
    const dot = document.getElementById(`dot-${i}`);
    if (!dot) continue;
    dot.className = 'dot';
    if (i < removed) dot.classList.add('done');
    else if (i === removed && getState() !== 'virgin') dot.classList.add('active');
  }
  document.getElementById('dotsLabel').textContent = `${removed} / ${STRIPS} 天`;
}

function renderButtons(st) {
  const btnStart  = document.getElementById('btnStart');
  const btnRedeem = document.getElementById('btnRedeem');
  const btnBreak  = document.getElementById('btnBreak');

  if (st === 'virgin') {
    btnStart.style.display  = '';
    btnRedeem.style.display = 'none';
    btnBreak.style.display  = 'none';
  } else if (st === 'done') {
    btnStart.style.display  = 'none';
    btnRedeem.style.display = '';
    btnBreak.style.display  = 'none';
  } else {
    btnStart.style.display  = 'none';
    btnRedeem.style.display = 'none';
    btnBreak.style.display  = '';
  }
}

function renderStats() {
  document.getElementById('statStreak').textContent = S.streak;
  document.getElementById('statTotal').textContent  = S.total;
  document.getElementById('statDays').textContent   = getTotalDays();
}

function renderAch() {
  document.getElementById('badges').innerHTML = ACHS.map(a => {
    const on = S.ach.includes(a.id);
    return `<div class="badge ${on?'on':'off'}" title="${a.desc}">${a.e} ${a.n}</div>`;
  }).join('');
}

function renderHistory() {
  const el = document.getElementById('histList');
  if (!S.history.length) { el.innerHTML = '<div class="empty-msg">暂无记录</div>'; return; }
  el.innerHTML = S.history.slice(0, 12).map(h => `
    <div class="hist-item ${h.ok?'ok':'bad'}">
      <div>
        <div>${fmtDate(h.ts)}</div>
        ${h.elapsed ? `<div class="hist-sub">间隔 ${fmtDur(h.elapsed)}</div>` : ''}
      </div>
      <div class="hist-res">${h.ok ? '✅ 达标' : '💔 破戒'}</div>
    </div>
  `).join('');
}

function renderTip() {
  document.getElementById('tipTxt').textContent = TIPS[S.tipIdx % TIPS.length];
}

function renderImage() {
  const bg = document.getElementById('revealBg');
  if (S.imageUrl) {
    bg.classList.add('has-image');
    bg.querySelector('::before'); // just to trigger
    // Set via inline style since ::before bg is tricky
    bg.style.backgroundImage = `url('${CSS.escape ? S.imageUrl : S.imageUrl}')`;
    bg.style.backgroundSize  = 'cover';
    bg.style.backgroundPosition = 'center';
    document.getElementById('rewardMsg').style.display = 'none';
  } else {
    bg.classList.remove('has-image');
    bg.style.backgroundImage = '';
    document.getElementById('rewardMsg').style.display = '';
  }
}

/* =============================================
   TIP
   ============================================= */
function nextTip() {
  S.tipIdx = (S.tipIdx + 1) % TIPS.length;
  const el = document.getElementById('tipTxt');
  el.style.opacity = '0';
  setTimeout(() => { el.textContent = TIPS[S.tipIdx]; el.style.opacity = '1'; }, 220);
  save();
}

/* =============================================
   IMAGE MODAL
   ============================================= */
function openImgModal() {
  document.getElementById('imgInput').value = S.imageUrl || '';
  document.getElementById('imgOverlay').classList.add('on');
}
function closeImgModal() { document.getElementById('imgOverlay').classList.remove('on'); }
function imgOverlayBg(e) { if (e.target.id === 'imgOverlay') closeImgModal(); }

function applyImage() {
  const url = document.getElementById('imgInput').value.trim();
  S.imageUrl = url;
  save();
  renderImage();
  closeImgModal();
  toast(url ? '🖼 底图已设置！' : '🖼 底图已清除', 'info');
}
function clearImage() {
  S.imageUrl = '';
  save();
  renderImage();
  closeImgModal();
  toast('🖼 底图已清除', 'info');
}

/* =============================================
   MODAL
   ============================================= */
function openModal()  { document.getElementById('overlay').classList.add('on'); }
function closeModal() { document.getElementById('overlay').classList.remove('on'); }
function overlayBg(e) { if (e.target.id === 'overlay') closeModal(); }

/* =============================================
   RESET
   ============================================= */
function askReset() {
  document.getElementById('mIcon').textContent  = '⚠️';
  document.getElementById('mTitle').textContent = '确认重置？';
  document.getElementById('mHeld').textContent  = '';
  document.getElementById('mBody').textContent  = '所有训练数据（连续记录、成就、历史）将被清除，底图设置保留。';
  document.getElementById('mBtns').innerHTML = `
    <button class="m-yield" onclick="doReset()">确认重置</button>
    <button class="m-persist" onclick="closeModal()">取消</button>
  `;
  openModal();
}
function doReset() {
  const img = S.imageUrl;
  localStorage.removeItem(SK);
  S = { startTs:null, lastTs:null, streak:0, total:0, ach:[], history:[], tipIdx:0, imageUrl:img };
  closeModal();
  resetStrips();
  lastKnownRemoved = -1;
  syncStripsInstant();
  renderAll();
  toast('🔄 已重置，重新出发！', 'info');
}

/* =============================================
   TOAST
   ============================================= */
let toastTid;
function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} up`;
  clearTimeout(toastTid);
  toastTid = setTimeout(() => el.classList.remove('up'), 3500);
}

/* =============================================
   STARS
   ============================================= */
function makeStars() {
  const el = document.getElementById('bgStars');
  let html = '';
  for (let i = 0; i < 40; i++) {
    const x = Math.random()*100, y = Math.random()*100;
    const s = 0.5 + Math.random()*1.5;
    const op = 0.15 + Math.random()*0.5;
    const dur = 2 + Math.random()*4;
    const delay = -Math.random()*4;
    html += `<div style="position:absolute;left:${x}%;top:${y}%;width:${s}px;height:${s}px;border-radius:50%;background:rgba(200,200,255,${op});animation:tw ${dur.toFixed(1)}s ease-in-out ${delay.toFixed(1)}s infinite"></div>`;
  }
  el.innerHTML = html;
  if (!document.getElementById('starStyle')) {
    const st = document.createElement('style');
    st.id = 'starStyle';
    st.textContent = '@keyframes tw{0%,100%{opacity:0.2}50%{opacity:0.9}}';
    document.head.appendChild(st);
  }
}

/* =============================================
   INIT
   ============================================= */
function init() {
  load();
  makeStars();

  // Restore strips to correct state (no animation on load)
  if (getState() !== 'virgin') {
    syncStripsInstant();
  }

  renderAll();
  setInterval(tick, 1000);
  setInterval(nextTip, 40000);
}

init();
</script>
</body>
</html>
