<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16063a"/>
      <stop offset="60%" stop-color="#0f0f1c"/>
      <stop offset="100%" stop-color="#021a10"/>
    </linearGradient>
    <linearGradient id="bolt" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06d6a0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ambient glow behind bolt -->
  <ellipse cx="256" cy="255" rx="110" ry="145" fill="rgba(124,58,237,0.18)" filter="url(#softglow)"/>

  <!-- Paper strips (suggest the app mechanic) -->
  <rect x="88" y="350" width="336" height="36" rx="5" fill="rgba(245,240,232,0.10)"/>
  <rect x="88" y="306" width="336" height="36" rx="5" fill="rgba(245,240,232,0.07)"/>

  <!-- Lightning bolt -->
  <path d="M298 78 L162 272 H244 L210 438 L354 238 H268 Z"
        fill="url(#bolt)"
        filter="url(#glow)"
        opacity="0.95"/>

  <!-- Inner highlight on bolt -->
  <path d="M298 78 L162 272 H244 L247 263 L349 100 Z"
        fill="rgba(255,255,255,0.12)"/>
</svg>
